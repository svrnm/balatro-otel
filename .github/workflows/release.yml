# Push a tag vX.Y.Z (matching the version in mod/otel-trace/otel-trace.json and manifest.json) to
# publish a GitHub release with:
#   otel-trace.zip                unzip into Balatro's Mods folder (contains the otel-trace folder)
#   otel_trace-thunderstore.zip   upload to Thunderstore (manifest.json, icon.png, README.md at the root)
#   SHA256SUMS                  checksums for both ZIPs; both also have GitHub attestations
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions match the tag
        run: |
          v=${GITHUB_REF_NAME#v}
          test "$v" = "$(jq -r .version mod/otel-trace/otel-trace.json)"
          test "$v" = "$(jq -r .version_number mod/otel-trace/manifest.json)"
      - name: Build zips
        run: |
          (cd mod && zip -r ../otel-trace.zip otel-trace -x otel-trace/manifest.json) # Steamodded logs an error for the Thunderstore manifest
          (cd mod/otel-trace && zip -r ../../otel_trace-thunderstore.zip .)
      - name: Generate checksums
        run: sha256sum otel-trace.zip otel_trace-thunderstore.zip > SHA256SUMS
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" otel-trace.zip otel_trace-thunderstore.zip SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
