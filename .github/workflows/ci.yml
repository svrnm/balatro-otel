name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Weaver compares the registry with the base commit.
      - run: sudo apt-get install -y luajit zip
      - name: Lua syntax (LuaJIT, like the game)
        run: for f in mod/otel-trace/*.lua telemetry/chaos/otel-chaos/*.lua; do luajit -b "$f" /dev/null; done
      - name: Offline exporter test
        run: |
          curl -sfL -o /tmp/smods.tar.gz https://github.com/Steamodded/smods/archive/refs/tags/1.0.0-beta-1814a.tar.gz
          (cd /tmp && sha256sum --check --ignore-missing "$GITHUB_WORKSPACE/telemetry/container/downloads.sha256")
          tar xzf /tmp/smods.tar.gz -C /tmp
          mkdir -p /tmp/otlp
          SMODS_DIR=/tmp/smods-1.0.0-beta-1814a luajit tests/otel_test.lua /tmp/otlp
          SMODS_DIR=/tmp/smods-1.0.0-beta-1814a luajit tests/scoring_test.lua /tmp/otlp
          python3 telemetry/weaver_samples.py /tmp/otlp/*.json > /tmp/weaver-samples.json
      - name: Mod metadata
        run: |
          v=$(jq -r .version mod/otel-trace/otel-trace.json)
          test "$v" = "$(jq -r .version_number mod/otel-trace/manifest.json)"
          grep -q "\"balatro-otel-trace\", \"$v\"" mod/otel-trace/otel.lua  # SDK_VERSION
      - name: Python (ruff)
        run: git ls-files -z '*.py' | xargs -0 pipx run ruff==0.17.3 check
      - name: Shell scripts (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: Semantic convention registry (Weaver)
        run: docker run --rm -v "$PWD/telemetry:/telemetry:ro" otel/weaver:v0.28.0@sha256:5857bb81d8cc7ed608cdcae37c4b459eb020f21dd4acade35f7933cd6762fbcc registry check --v2 -r /telemetry/registry
      - name: Emitted telemetry (Weaver live-check)
        run: |
          docker run --rm -v "$PWD/telemetry:/telemetry:ro" -v /tmp/weaver-samples.json:/samples.json:ro \
            otel/weaver:v0.28.0@sha256:5857bb81d8cc7ed608cdcae37c4b459eb020f21dd4acade35f7933cd6762fbcc \
            registry live-check --v2 -r /telemetry/registry --config /telemetry/.weaver.toml \
            --input-source /samples.json --output none
      - name: Generated scoring reference is current
        run: |
          mkdir -p /tmp/weaver-docs
          docker run --rm -v "$PWD/telemetry:/telemetry:ro" -v /tmp/weaver-docs:/out \
            otel/weaver:v0.28.0@sha256:5857bb81d8cc7ed608cdcae37c4b459eb020f21dd4acade35f7933cd6762fbcc \
            registry generate --v2 -r /telemetry/registry --templates /telemetry/templates scoring /out
          git diff --exit-code --no-index docs/scoring-signals.md /tmp/weaver-docs/scoring-signals.md
      - name: Semantic convention changes
        env:
          REGISTRY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${REGISTRY_BASE:-HEAD^}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit available; registry comparison skipped."
            exit 0
          fi
          mkdir -p /tmp/weaver-base
          git archive "$base" telemetry/registry | tar -x -C /tmp/weaver-base
          docker run --rm -v "$PWD/telemetry:/telemetry:ro" -v /tmp/weaver-base:/baseline:ro \
            otel/weaver:v0.28.0@sha256:5857bb81d8cc7ed608cdcae37c4b459eb020f21dd4acade35f7933cd6762fbcc \
            registry diff --v2 -r /telemetry/registry --baseline-registry /baseline/telemetry/registry
