# Collector for live-check runs (started and stopped by live-check.sh, together with Weaver).
# Receives OTLP/HTTP from the game and forwards everything to Weaver (gRPC only) and to the stack's
# collector (telemetry/stack), so Jaeger, Prometheus and the log file still get the test session. Being as short-lived as Weaver, it never holds a stale
# connection to an old live-check container.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp_grpc/weaver:
    endpoint: weaver-live:4317
    compression: none # Weaver v0.28.0 rejects gzip: "Content is compressed with `gzip` which isn't supported"
    tls:
      insecure: true
  otlp_http/stack:
    endpoint: http://otelcol:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/weaver, otlp_http/stack]
    metrics:
      receivers: [otlp]
      exporters: [otlp_grpc/weaver, otlp_http/stack]
    logs:
      receivers: [otlp]
      exporters: [otlp_grpc/weaver, otlp_http/stack]
