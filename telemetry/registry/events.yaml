file_format: definition/2

# Events are log records with an event name, correlated to the span that was open
# (OTEP 4430: log-based events instead of span events). session.id and balatro.run.seed are on
# every record (attribute group balatro.common).
#
# Upstream events used as-is: session.start (once per launch), app.jank (one per frame slower than
# 0.1 s, plus the balatro.app.jank group), app.crash (plus the balatro.app.crash group).

imports:
  events:
    - session.start
    - app.crash
    - app.jank

events:
  - name: balatro.effect
    stability: development
    requirement_level: recommended
    brief: An effect handler was invoked during synchronous hand scoring; outcome and before/after state describe observed handling, not causal impact.
    attributes:
      - ref: balatro.effect.key
        requirement_level: required
      - ref: balatro.effect.amount
        requirement_level:
          conditionally_required: When the argument is a finite number.
      - ref: balatro.effect.source
        requirement_level: recommended
      - ref: balatro.score.chips
        requirement_level: recommended
      - ref: balatro.score.mult
        requirement_level: recommended

      - ref: balatro.effect.sequence
        requirement_level: recommended
      - ref: balatro.effect.parent_sequence
        requirement_level: recommended
      - ref: balatro.effect.from_edition
        requirement_level: recommended
      - ref: balatro.effect.component
        requirement_level: recommended
      - ref: balatro.effect.outcome
        requirement_level: recommended
      - ref: balatro.effect.attribution
        requirement_level: recommended
      - ref: balatro.effect.source_card.instance.id
        requirement_level: recommended
      - ref: balatro.effect.source_card.key
        requirement_level: recommended
      - ref: balatro.effect.target.instance.id
        requirement_level: recommended
      - ref: balatro.effect.target.key
        requirement_level: recommended
      - ref: balatro.effect.target.name
        requirement_level: recommended
      - ref: balatro.score.before.chips
        requirement_level: recommended
      - ref: balatro.score.before.mult
        requirement_level: recommended

  - name: balatro.card.trigger
    stability: development
    requirement_level: recommended
    brief: An explicit true trigger result from Card.calculate_joker during synchronous hand scoring; effect-only returns without that flag do not emit this event. Timestamp is calculation completion; default severity is INFO.
    attributes:
      - ref: balatro.card.name
        requirement_level: recommended
      - ref: balatro.card.key
        requirement_level: recommended
      - ref: balatro.card.area
        requirement_level: recommended
      - ref: balatro.card.evaluation.context
        requirement_level: recommended
      - ref: balatro.card.trigger.reported
        requirement_level: recommended
      - ref: balatro.card.instance.id
        requirement_level: recommended
      - ref: balatro.card.rank
        requirement_level: recommended
      - ref: balatro.card.suit
        requirement_level: recommended
      - ref: balatro.card.enhancement
        requirement_level: recommended
      - ref: balatro.card.edition
        requirement_level: recommended
      - ref: balatro.card.seal
        requirement_level: recommended
      - ref: balatro.card.debuffed
        requirement_level: recommended
      - ref: balatro.card.set
        requirement_level: recommended
      - ref: balatro.card.evaluation.retrigger
        requirement_level: recommended
      - ref: balatro.card.evaluation.copy
        requirement_level: recommended
      - ref: balatro.card.evaluation.copy_source.id
        requirement_level: recommended
      - ref: balatro.card.evaluation.retrigger_source.id
        requirement_level: recommended

  - name: balatro.card.copy
    stability: development
    requirement_level: recommended
    brief: SMODS.blueprint_effect returned a nonempty effect table during synchronous hand scoring. The card identity describes the copied card and copy_source identifies the copier. Timestamp is helper completion; default severity is INFO.
    attributes:
      - ref: balatro.card.name
        requirement_level: recommended
      - ref: balatro.card.key
        requirement_level: recommended
      - ref: balatro.card.area
        requirement_level: recommended
      - ref: balatro.card.evaluation.context
        requirement_level: recommended
      - ref: balatro.card.evaluation.has_effects
        requirement_level: recommended
      - ref: balatro.card.instance.id
        requirement_level: recommended
      - ref: balatro.card.rank
        requirement_level: recommended
      - ref: balatro.card.suit
        requirement_level: recommended
      - ref: balatro.card.enhancement
        requirement_level: recommended
      - ref: balatro.card.edition
        requirement_level: recommended
      - ref: balatro.card.seal
        requirement_level: recommended
      - ref: balatro.card.debuffed
        requirement_level: recommended
      - ref: balatro.card.set
        requirement_level: recommended
      - ref: balatro.card.evaluation.retrigger
        requirement_level: recommended
      - ref: balatro.card.evaluation.copy
        requirement_level: recommended
      - ref: balatro.card.evaluation.copy_source.id
        requirement_level: recommended
      - ref: balatro.card.evaluation.retrigger_source.id
        requirement_level: recommended

  - name: balatro.discard
    stability: development
    requirement_level: recommended
    brief: Cards were discarded.
    attributes:
      - ref: balatro.discard.card_count
        requirement_level: required

  - name: balatro.blind.skip
    stability: development
    requirement_level: recommended
    brief: A blind was skipped (for its tag).
    attributes:
      - ref: balatro.blind.slot
        requirement_level: required
      - ref: balatro.ante
        requirement_level: recommended

  - name: balatro.shop.reroll
    stability: development
    requirement_level: recommended
    brief: The shop was rerolled.
    attributes:
      - ref: balatro.shop.reroll_cost
        requirement_level: recommended
      - ref: balatro.dollars
        requirement_level: recommended

  - name: balatro.card.buy
    stability: development
    requirement_level: recommended
    brief: A card was bought from the shop.
    attributes:
      - ref: balatro.card.name
        requirement_level: required
      - ref: balatro.card.key
        requirement_level: recommended
      - ref: balatro.card.set
        requirement_level: recommended
      - ref: balatro.card.cost
        requirement_level: recommended
      - ref: balatro.shop.buy_and_use
        requirement_level: recommended
      - ref: balatro.dollars
        requirement_level: recommended

  - name: balatro.card.sell
    stability: development
    requirement_level: recommended
    brief: A card was sold.
    attributes:
      - ref: balatro.card.name
        requirement_level: required
      - ref: balatro.card.key
        requirement_level: recommended
      - ref: balatro.card.set
        requirement_level: recommended
      - ref: balatro.card.sell_value
        requirement_level: recommended
      - ref: balatro.dollars
        requirement_level: recommended

  - name: balatro.card.use
    stability: development
    requirement_level: recommended
    brief: A consumable was used, or a card was picked from a booster pack.
    attributes:
      - ref: balatro.card.name
        requirement_level: required
      - ref: balatro.card.key
        requirement_level: recommended
      - ref: balatro.card.set
        requirement_level: recommended
      - ref: balatro.dollars
        requirement_level: recommended

  - name: balatro.card.redeem
    stability: development
    requirement_level: recommended
    brief: A voucher was redeemed.
    attributes:
      - ref: balatro.card.name
        requirement_level: required
      - ref: balatro.card.key
        requirement_level: recommended
      - ref: balatro.card.set
        requirement_level: recommended
      - ref: balatro.dollars
        requirement_level: recommended
