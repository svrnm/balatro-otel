# Grafana dashboard provider for the lgtm container: loads telemetry/grafana/*.json (mounted at
# /otel-lgtm/balatro-dashboards) and re-reads it every 10 s, so edits show up without a restart.
apiVersion: 1
providers:
  - name: balatro
    type: file
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /otel-lgtm/balatro-dashboards
