templates:
  - template: bot-signals.md.j2
    filter: >
      {
        spans: (semconv_grouped_spans({"v2": true}) | map(select(.root_namespace == "balatro" or .root_namespace == "rpc"))),
        events: (semconv_grouped_events({"v2": true}) | map(select(.root_namespace == "balatro" or .root_namespace == "rpc"))),
        metrics: (semconv_grouped_metrics({"v2": true}) | map(select(.root_namespace == "balatro" or .root_namespace == "rpc")))
      }
    application_mode: single
    file_name: bot-signals.md
