# grafana/otel-lgtm:0.37.0 collector config, mounted over /otel-lgtm/otelcol-config.yaml.
# One change from the stock file: transform/event_name. Loki drops the OTLP log EventName field, so
# events (balatro.effect, app.jank, app.crash, ...) would be indistinguishable there; this copies
# it into the event.name attribute for Loki only. The mod itself stays on the EventName field.
# Added: otlp_http/compy, a copy of all OTLP input (not lgtm's own collector metrics) to the local
# compy collector on the Mac, which forwards to Bronto. Unchanged records: no event.name copy.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  transform/event_name:
    log_statements:
      - set(log.attributes["event.name"], log.event_name) where log.event_name != ""

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed
  otlp_http/compy:
    endpoint: http://host.docker.internal:14318

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [transform/event_name, batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
    traces/compy:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/compy]
    metrics/compy:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/compy]
    logs/compy:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/compy]
